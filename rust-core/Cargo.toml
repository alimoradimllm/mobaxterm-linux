[package]
name = "moraxterm_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portable core for the clean-room Moraxterm compatibility layer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
anyhow = "1"

[lib]
name = "moraxterm_core"
path = "src/lib.rs"

[[bin]]
name = "moraxterm-core"
path = "src/main.rs"
