[package]
name = "moraxterm-linux-ui"
version = "0.1.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libc = "0.2"
moraxterm_core = { package = "moraxterm_core", path = "../../rust-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
