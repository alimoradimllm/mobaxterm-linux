[package]
name = "mobaxterm-linux-ui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
mobaxterm_core = { package = "mobaxterm_core", path = "../../rust-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
